<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trend Radar</title>
<meta name="description" content="Research any topic and see what's trending about it right now across Google, YouTube, Reddit, X, TikTok, Instagram and Google News, with content angles for marketers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='16' fill='none' stroke='%23127A67' stroke-width='2'/%3E%3Cpath d='M18 18 L18 3 A15 15 0 0 1 31 11 Z' fill='%23127A67' opacity='.4'/%3E%3Ccircle cx='18' cy='18' r='3' fill='%23127A67'/%3E%3Ccircle cx='25' cy='9.5' r='2.5' fill='%23E14A22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface-2:#EAF0E9; --ink:#151A17; --ink-2:#48524C; --muted:#7A857D; --line:#D9E1D9; --line-2:#C4CEC5;
  --accent:#127A67; --accent-ink:#0B5C4D; --accent-soft:#DCF0EA; --flare:#E14A22; --flare-soft:#FCE5DD;
  --good:#0ca30c; --warn:#b97a00; --warn-bg:#FFF4D6; --crit:#d03b3b; --crit-bg:#FDE4E4; --good-bg:#E3F5E3;
  --viz-1:#2a78d6; --shadow:0 1px 2px rgba(21,26,23,.05),0 8px 24px -12px rgba(21,26,23,.18);
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif; --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161C19; --surface-2:#1C2420; --ink:#E7ECE8; --ink-2:#B4BFB7; --muted:#88948B; --line:#26302A; --line-2:#344038;
  --accent:#3BD3AD; --accent-ink:#8FE8D0; --accent-soft:#12332C; --flare:#FF7A57; --flare-soft:#3B1E15;
  --good:#4ADE80; --warn:#fab219; --warn-bg:#2E2410; --crit:#F87171; --crit-bg:#3A1A1A; --good-bg:#12301A; --viz-1:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161C19; --surface-2:#1C2420; --ink:#E7ECE8; --ink-2:#B4BFB7; --muted:#88948B; --line:#26302A; --line-2:#344038;
  --accent:#3BD3AD; --accent-ink:#8FE8D0; --accent-soft:#12332C; --flare:#FF7A57; --flare-soft:#3B1E15;
  --good:#4ADE80; --warn:#fab219; --warn-bg:#2E2410; --crit:#F87171; --crit-bg:#3A1A1A; --good-bg:#12301A; --viz-1:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit} button{font:inherit;color:inherit} h1,h2,h3,h4{margin:0;text-wrap:balance}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* masthead */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:11px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.brand .mark{width:34px;height:34px;flex:none}
.brand h1{font:400 28px/1 var(--f-display);letter-spacing:-.01em}
.brand h1 em{font-style:italic;color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px/1.4 var(--f-mono);color:var(--muted);min-width:0}
.status b{color:var(--ink);font-weight:600}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 3px var(--accent-soft)}
.status .dot.run{background:var(--flare);box-shadow:0 0 0 3px var(--flare-soft);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
nav.tabs{margin-left:auto;display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.tabs a .n{font:500 11px var(--f-mono);color:var(--muted);margin-left:5px}
.topbtns{display:flex;gap:6px;align-items:center}
@media (max-width:760px){nav.tabs{margin-left:0;flex:1 1 100%}}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1311}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1311}}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-ink)}
.btn.icon{padding:8px;width:36px;justify-content:center}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* home */
.hero{padding:56px 0 24px;max-width:840px}
.hero h2{font:400 clamp(34px,6vw,58px)/1.05 var(--f-display);letter-spacing:-.015em}
.hero h2 em{font-style:italic;color:var(--accent)}
.hero p{font-size:16px;color:var(--ink-2);max-width:60ch;margin:14px 0 0}
.sform{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:22px}
.search{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.search:focus-within,.brief:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;font:500 17px var(--f-ui);padding:10px 12px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search .btn{border-radius:10px;padding:10px 18px;font-size:14px}
/* focus brief: same width as the search bar; a longer description of the angle the AI should keep */
.brief{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:10px 14px 8px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
.brief .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brief .bh{flex-wrap:nowrap} .brief .bh .lbl{color:var(--accent-ink);flex:none} .brief .bh .opt{font:500 11px var(--f-mono);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief .bh .cnt{flex:none;margin-left:auto;font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums} .brief .bh .cnt.max{color:var(--crit)}
@media (max-width:600px){.brief .bhint .kbdhint{display:none}}
.brief textarea{width:100%;border:0;background:none;resize:none;font:500 15px/1.5 var(--f-ui);color:var(--ink);padding:4px 0 2px;min-height:64px;max-height:320px;overflow:auto;field-sizing:content}
.brief textarea::placeholder{color:var(--muted);font-weight:400}
.brief .bhint{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line)}
.brief .bhint kbd{font:500 10.5px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2)}
.brief-view{margin-top:10px;max-width:86ch;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.brief-view .lbl{color:var(--accent-ink);padding-top:3px} .brief-view p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
/* every result opens on its platform: show it on hover */
a.ext{text-decoration:none} a.ext::after{content:"↗";font:600 10px var(--f-mono);margin-left:4px;color:var(--accent);opacity:0;transition:opacity .15s} a.ext:hover::after,a.ext:focus-visible::after{opacity:1}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.off{opacity:.5;text-decoration:line-through}
.chip .n{font:500 11px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font:600 11.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.examples{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.examples .chip{background:none}
.recent{margin:36px 0 60px}
.recent h3,.sec-h h2{font:400 26px/1.1 var(--f-display)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:grid;gap:6px;text-align:left}
.rcard:hover{border-color:var(--accent)}
.rcard .t{font-weight:700;font-size:15px}
.rcard .m{font:500 11.5px var(--f-mono);color:var(--muted)}
.rcard .s{font-size:12.5px;color:var(--ink-2)} .rcard .f{font-size:12px;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:2px dashed var(--line-2);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font:400 22px var(--f-display);margin-bottom:6px}
.note{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0}
.note.err{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}

/* job header + progress */
.jobhead{padding:22px 0 10px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.jobhead h2{font:400 clamp(26px,4vw,40px)/1.1 var(--f-display)}
.jobhead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--f-mono);color:var(--muted);margin-top:6px}
.progress{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:12px 0 6px}
.src{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12.5px}
.src .lg{flex:none}
.src .t{min-width:0;flex:1}
.src .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .t span{color:var(--muted);font:500 11px var(--f-mono)}
.src .st{font:600 11px var(--f-mono);padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.src.st-done .st{background:var(--good-bg);color:var(--good)} .src.st-failed .st,.src.st-empty .st{background:var(--crit-bg);color:var(--crit)} .src.st-running .st{background:var(--flare-soft);color:var(--flare)}
.src .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.src .tm{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.src.st-running .tm{color:var(--flare)}
.timing{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.timing .row{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.timing .row .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timing .bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.timing .bar i{display:block;height:100%;border-radius:6px;background:var(--accent);min-width:3px}
.timing .row.brain .bar i{background:var(--flare)} .timing .row.st-failed .bar i,.timing .row.st-empty .bar i{background:var(--crit)} .timing .row.st-running .bar i{background:var(--flare);opacity:.6}
.timing .v{font:600 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.timing .tot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)} .timing .tot b{color:var(--ink);font-family:var(--f-mono)}
@media (max-width:560px){.timing .row{grid-template-columns:110px 1fr 54px}}
.summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:16px 18px;margin:14px 0 18px;display:grid;gap:8px}
.summary p{margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
.summary .nq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.summary .brainst{font:500 11.5px var(--f-mono);color:var(--muted)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px 4px}
.filters input[type=search]{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);font:500 14px var(--f-ui)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:6px 4px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.catrow{display:flex;flex-wrap:wrap;gap:6px;padding-block:6px 12px}

/* kpis + radar */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-block:8px 18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font:600 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:400 32px/1 var(--f-display)} .kpi .v small{font:500 12px var(--f-ui);color:var(--muted);margin-left:6px}
.kpi .s{font-size:12px;color:var(--ink-2)} .kpi.flare .v{color:var(--flare)}
.radar{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:1040px){.radar{grid-template-columns:1fr}}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:6px 0 12px}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sig.caution{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))} .sig.avoid{opacity:.72}
.sig-top{display:grid;grid-template-columns:56px minmax(0,1fr) 34px;gap:12px;align-items:start}
.ring{width:56px;height:56px;position:relative} .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)} .ring .bar{stroke:var(--accent);stroke-linecap:round} .ring.hot .bar{stroke:var(--flare)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--f-mono)}
.sig h3{font:700 16px/1.25 var(--f-ui);margin-top:4px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.cat{background:var(--accent-soft);color:var(--accent-ink)} .tag.safe{background:var(--good-bg);color:var(--good)} .tag.caution{background:var(--warn-bg);color:var(--warn)} .tag.avoid{background:var(--crit-bg);color:var(--crit)} .tag.rise{background:var(--flare-soft);color:var(--flare)}
.plats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lg{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--brand,var(--ink));flex:none}
.lg svg{width:14px;height:14px;fill:currentColor} .lg.big{width:34px;height:34px;border-radius:10px} .lg.big svg{width:20px;height:20px} .lg.xs{width:18px;height:18px;border-radius:5px} .lg.xs svg{width:11px;height:11px}
.plats .k{font:500 11.5px var(--f-mono);color:var(--muted)}
.pin{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.pin svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.pin[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff} .pin[aria-pressed="true"] svg{fill:currentColor}
:root[data-theme="dark"] .pin[aria-pressed="true"]{color:#0E1311}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pin[aria-pressed="true"]{color:#0E1311}}
.why{margin:0;color:var(--ink-2);font-size:13.5px}
.sig details{border-top:1px solid var(--line);padding-top:8px}
.sig summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--accent-ink);list-style:none;display:flex;justify-content:space-between}
.sig summary::-webkit-details-marker{display:none} .sig summary::after{content:"+";font:500 16px var(--f-mono);color:var(--muted)} .sig details[open] summary::after{content:"−"}
.angles{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.formats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.ev{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ev li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.ev a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ev a:hover{color:var(--accent);text-decoration:underline}
.ev .m{font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ev.top{margin:0;padding:0 0 2px} .ev.top a{font-weight:600}
.srcs-h{font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.sig h3 a{color:inherit;text-decoration:none} .sig h3 a:hover{color:var(--accent);text-decoration:underline}
.plist .t a{color:var(--ink);font-weight:600} .plist .t a:hover{color:var(--accent);text-decoration:underline}
.kpi .s .jump{color:var(--accent-ink);font-weight:600;text-decoration:none} .kpi .s .jump:hover{text-decoration:underline}
.tag.sig{background:var(--accent-soft);color:var(--accent-ink)}
/* all results list under the signals */
.allres{margin-top:26px} .allres .sec-h h2 .cnt{font:500 14px var(--f-mono);color:var(--muted);margin-left:6px;vertical-align:middle}
.flatbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.flatbox .row{padding:10px 16px} .flatbox .row .t a{font-size:14.5px}
.row .meta .pl{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-weight:600}
.rail{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}

.bar .trk{display:block;height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden} .bar .fill{display:block;height:100%;background:var(--viz-1);border-radius:0 3px 3px 0;min-width:2px}

.series{width:100%;height:70px} .series path.a{fill:var(--accent-soft)} .series path.l{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round} .series circle{fill:var(--accent)} .series text{font:500 10px var(--f-mono);fill:var(--muted)}
.spark{width:84px;height:26px;flex:none} .spark path.a{fill:var(--flare-soft)} .spark path.l{fill:none;stroke:var(--flare);stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .spark circle{fill:var(--flare)}
.spark.down path.a{fill:var(--surface-2)} .spark.down path.l{stroke:var(--muted)} .spark.down circle{fill:var(--muted)}

.pgrid{columns:3 350px;column-gap:16px;padding-top:6px}

.pcard-h h2{font:700 17px/1.2 var(--f-ui)} .pcard-h .src2{font:500 11.5px var(--f-mono);color:var(--muted)} .pcard-h .cnt{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.rows{list-style:none;margin:0;padding:4px 0}

.row:first-child{border-top:0} .row.off{opacity:.75} .row.off .t a{font-weight:500}
.row .rk{font:500 12.5px/1.6 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .t a{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere} .row .t a:hover{color:var(--accent);text-decoration:underline}

.row .meta .m{color:var(--accent-ink)} .row .meta .g{color:var(--flare)} .row .meta .tag{padding:2px 6px;font-size:10.5px}
.row .pin{width:28px;height:28px;border-radius:7px} .row .pin svg{width:14px;height:14px}
.more{display:block;width:100%;padding:10px;border:0;border-top:1px solid var(--line);background:none;color:var(--accent-ink);font-weight:700;font-size:12.5px;cursor:pointer}
.pnote{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}

/* table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}

th[aria-sort]::after{content:" ↓";color:var(--accent)} th[aria-sort="ascending"]::after{content:" ↑"}

.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:8px} .tbar .sub{font-size:12.5px;color:var(--muted)}

.htab{min-width:1060px} .htab td{font-size:13px} .htab td a{font-weight:700} .htab .focus-cell,.htab .top-cell{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)} .htab td.num small{color:var(--muted);font-size:11px}

.costgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px} @media (max-width:860px){.costgrid{grid-template-columns:minmax(0,1fr)}}
.spendchart{width:100%;height:160px;display:block} .spendchart .grid{stroke:var(--line);stroke-width:1} .spendchart .b{fill:var(--accent)} .spendchart g:hover .b{fill:var(--accent-ink)} .spendchart .hit{fill:transparent} .spendchart text{font:500 10px var(--f-mono);fill:var(--muted)}

.timing.cost .bar i{background:var(--viz-1)} .timing.cost .row.brain .bar i{background:var(--flare)} .timing.cost .row.st-none .bar i{background:var(--line-2)}

/* shortlist drawer + modal */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.drawer.open{transform:none}

/* loading veil: translucent screen shown while a research runs; fades out the moment results are ready */

.vcard{width:min(620px,100%);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 90px -30px rgba(21,26,23,.45),var(--shadow);padding:24px 24px 18px;display:grid;gap:16px;animation:veil-in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes veil-in{from{opacity:0;transform:translateY(16px) scale(.985)}}
.vtop{display:flex;gap:18px;align-items:center}
.vhead{min-width:0;flex:1}
.vhead h2{font:400 clamp(22px,3.6vw,30px)/1.15 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.vhead h2 em{font-style:italic;color:var(--accent)}
.vhead .ph{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:500 12.5px var(--f-mono);color:var(--muted);margin-top:7px}
.vhead .ph b{color:var(--ink);font-weight:600} .vhead .ph .tm{color:var(--flare);font-variant-numeric:tabular-nums}
.sweep{width:96px;height:96px;flex:none;position:relative}
.sweep svg{width:100%;height:100%;overflow:visible}
.sweep .ring{fill:none;stroke:var(--accent);opacity:.32} .sweep .cross{stroke:var(--accent);opacity:.18}

.sweep .b2{animation-delay:.9s} .sweep .b3{animation-delay:1.7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,12%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.15)}65%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
.vbar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.vbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--flare));transition:width .7s ease;min-width:3%}
.vbar.indet i{width:38%!important;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:2px 12px;max-height:min(42vh,340px);overflow:auto;margin:0 -8px}
.vrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;font-size:13px;min-width:0}
.vrow .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .vs{font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vrow.st-running .vs{color:var(--flare)} .vrow.st-done .vs{color:var(--good)} .vrow.st-failed .vs,.vrow.st-empty .vs{color:var(--crit)}
.vrow .ic{width:15px;height:15px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 9.5px var(--f-mono)}
.vrow .ic.sp{border:2px solid var(--line-2);border-top-color:var(--flare);animation:spin .8s linear infinite}
.vrow .ic.ok{background:var(--good-bg);color:var(--good)} .vrow .ic.no{background:var(--crit-bg);color:var(--crit)} .vrow .ic.qd{border:2px dashed var(--line-2)}

.vrow .ai{width:18px;height:18px;border-radius:5px;background:var(--flare-soft);color:var(--flare);display:grid;place-items:center;font:800 8.5px var(--f-mono);flex:none}
.vfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:520px){.vcard{padding:18px 16px 14px}.vtop{gap:12px}.sweep{width:68px;height:68px}}

<footer class="wrap"><span id="foot-l">Trend Radar · research any topic across seven platforms</span><span>Data via Apify actors · analysis via OpenRouter · logos: Simple Icons (CC0)</span></footer>

  <div class="dh"><h3>Shortlist</h3><div><button class="btn ghost" id="copy-all">Copy all briefs</button><button class="btn icon" id="drawer-close" aria-label="Close">✕</button></div></div>
  <div class="db" id="drawer-body"></div>
</aside>

<script src="/logos.js"></script>
<script>
/* ---------- constants ---------- */
const PLAT = {
  google:{name:"Google",color:"#4285F4",src:"Search interest / Trending Now"}, news:{name:"Google News",color:"#1A73E8",src:"News articles"},
  youtube:{name:"YouTube",color:"#FF0000",src:"Videos"}, reddit:{name:"Reddit",color:"#FF4500",src:"Posts"},
  x:{name:"X",color:"var(--ink)",src:"Posts / trends"}, tiktok:{name:"TikTok",color:"var(--ink)",src:"Videos / hashtags"},
  instagram:{name:"Instagram",color:"#E4405F",src:"Reels"}, pinterest:{name:"Pinterest",color:"#BD081C",src:"Top searches"},
};
const TOPIC_PLATS = ["news","google","reddit","youtube","x","tiktok","instagram"];
const TREND_PLATS = ["google","news","reddit","youtube","x","tiktok","pinterest","instagram"];
const VIEWS = [["radar","Radar"],["platforms","Platforms"],["table","Table"],["sources","Sources"]];
const CAT_ORDER = ["Sports","Entertainment","Music","Gaming","Tech & AI","Business","Politics & Law","Lifestyle & Seasonal","Fashion & Beauty","Food & Drink","Science & Nature","News & Weather","Health","Culture & Creators","Other"];
const EXAMPLES = ["AI automation","skincare routine","IPL","electric scooters India","Diwali gifting","protein snacks","Taylor Swift","smart home"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => { if (n == null || n === "") return ""; n = +n; if (!isFinite(n)) return ""; return n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+"K" : String(Math.round(n)); };
const ago = h => h == null ? "" : h < 1 ? "<1h" : h < 48 ? Math.round(h)+"h" : Math.round(h/24)+"d";
const tag = (t, cls="") => `<span class="tag ${cls}">${esc(t)}</span>`;
const safetyTag = s => tag(s === "safe" ? "brand-safe" : s === "caution" ? "caution" : "avoid", s);
// Every result must open somewhere real: a scraped URL when it is a proper link, otherwise the platform's own search for it.
const SEARCH_URL = { news:"https://news.google.com/search?q=", google:"https://www.google.com/search?q=", youtube:"https://www.youtube.com/results?search_query=", reddit:"https://www.reddit.com/search/?q=", x:"https://x.com/search?q=", tiktok:"https://www.tiktok.com/search?q=", instagram:"https://www.instagram.com/explore/search/keyword/?q=", pinterest:"https://www.pinterest.com/search/pins/?q=" };
const linkOf = i => /^https?:\/\//i.test(i?.url || "") ? i.url : (SEARCH_URL[i?.platform] || SEARCH_URL.google) + encodeURIComponent(i?.topic || "");
const openTitle = i => `Open on ${PLAT[i?.platform]?.name || "the web"}`;
const trendsUrl = (topic, region, windowH) => `https://trends.google.com/trends/explore?date=${windowH <= 24 ? "now%201-d" : "now%207-d"}${region && region !== "Global" ? "&geo=" + region : ""}&q=${encodeURIComponent(topic || "")}`;
const BRIEF_MAX = 1500;

/* ---------- settings (localStorage) ---------- */
const SETTINGS_KEY = "tr-settings";
let settings = {}; try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"); } catch {}
function saveSettings(){ try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }
// Invite links: https://site/?k=<access code> — the code is saved once and removed from the address bar.
try { const u = new URL(location.href); const k = u.searchParams.get("k"); if (k) { settings.code = k.trim(); saveSettings(); u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); } } catch {}
function inviteLink(){ const u = new URL(location.origin + "/"); if (settings.code) u.searchParams.set("k", settings.code); return u.toString(); }
function authHeaders(){ const h = {}; if (settings.apify) h["x-apify-token"] = settings.apify; if (settings.openrouter) h["x-openrouter-key"] = settings.openrouter; if (settings.model) h["x-openrouter-model"] = settings.model; if (settings.code) h["x-access-code"] = settings.code; return h; }
async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type":"application/json", ...authHeaders(), ...(opts.headers||{}) } });
  const json = await res.json().catch(() => ({ error: "Bad response from server" }));
  if (!res.ok) { const e = new Error(json.error || res.statusText); e.status = res.status; throw e; }
  return json;
}

/* ---------- state ---------- */
let health = null, job = null, pollTimer = null;
let state = { view:"radar", q:"", cats:new Set(), safeOnly:false, plats:new Set(), expanded:new Set(), sort:{k:"score",d:-1}, showOff:false };
let form = { mode:"topic", topic:"", brief:"", region:"US", windowH:24, plats:new Set(TOPIC_PLATS) };
let pins = []; try { pins = JSON.parse(localStorage.getItem("tr-pins") || "[]"); } catch {}
const savePins = () => { try { localStorage.setItem("tr-pins", JSON.stringify(pins)); } catch {} $("#shortlist-n").textContent = pins.length; };

function logo(p, cls="") { const d = window.LOGOS?.[p]; const c = PLAT[p]?.color || "var(--ink)"; return `<span class="lg ${cls}" style="--brand:${c}" title="${esc(PLAT[p]?.name||p)}">${d ? `<svg viewBox="0 0 24 24" role="img" aria-label="${esc(PLAT[p]?.name||p)}"><path d="${d}"/></svg>` : esc((PLAT[p]?.name||p)[0])}</span>`; }
function ring(score, hot) { const r=24, c=2*Math.PI*r, f=Math.max(0,Math.min(100,score))/100; return `<div class="ring${hot?" hot":""}" title="Opportunity score ${score}/100"><svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="${r}" fill="none" stroke-width="5"/><circle class="bar" cx="28" cy="28" r="${r}" fill="none" stroke-width="5" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg><span class="num">${score}</span></div>`; }
function spark(curve, dir) { if (!curve?.length) return ""; const w=84,h=26,pad=3,n=curve.length,max=Math.max(...curve,1); const pts=curve.map((v,i)=>[pad+i*(w-2*pad)/Math.max(n-1,1), h-pad-(v/max)*(h-2*pad)]); const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "); const area=line+` L${pts[n-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`; const [ex,ey]=pts[n-1]; return `<svg class="spark${dir==="down"?" down":""}" viewBox="0 0 ${w} ${h}" role="img" aria-label="7-day trend"><path class="a" d="${area}"/><path class="l" d="${line}"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.6"/></svg>`; }

  const pts = series?.points || []; if (pts.length < 3) return "";
  const w=300,h=70,pad=6,max=100; const xs=pts.map((p,i)=>pad+i*(w-2*pad)/(pts.length-1)); const ys=pts.map(p=>h-14-(p.v/max)*(h-22));
  const line=xs.map((x,i)=>(i?"L":"M")+x.toFixed(1)+" "+ys[i].toFixed(1)).join(" "); const area=line+` L${xs.at(-1).toFixed(1)} ${h-14} L${xs[0].toFixed(1)} ${h-14} Z`;

}

  const id = m?.[1]; const hash = (location.hash || "#radar").slice(1);

  if (id) loadJob(id); else if (/^\/history\/?$/.test(location.pathname)) renderHistory(); else renderHome();
}

/* The cost tracker on the History page: totals from the archive, with today / this month / per-day worked out in the viewer's own timezone. */
function costTrackerHTML() {

  const recent = hist.stats.recent || [];
  const dayKey = d => { d = new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

  let tUsd = 0, tN = 0, mUsd = 0, mN = 0; const perDay = {};
  for (const [at, usd] of recent) { const k = dayKey(at); perDay[k] = perDay[k] || { usd: 0, n: 0 }; perDay[k].usd += usd; perDay[k].n++; if (k === today) { tUsd += usd; tN++; } if (k.startsWith(month)) { mUsd += usd; mN++; } }
  const days = []; for (let i = 29; i >= 0; i--) { const d = new Date(now); d.setDate(now.getDate() - i); const k = dayKey(d); days.push({ k, d, usd: perDay[k]?.usd || 0, n: perDay[k]?.n || 0 }); }
  const avg = sp.tracked ? sp.total_usd / sp.tracked : null;
  const plats = Object.entries(sp.by_platform).sort((a,b) => b[1] - a[1]); if (sp.brain_usd) plats.push(["ai", sp.brain_usd]); const pmax = Math.max(0.000001, ...plats.map(p => p[1]));

  if (!sp.tracked) return `<section class="costs"><div class="sec-h"><h3>Cost tracker</h3><span class="sub">Apify + OpenRouter credits per research</span></div><div class="empty"><b>No costs recorded yet</b>From now on every research records what each scraper and the AI step charged; the totals appear here.</div></section>`;
  return `<section class="costs">
    <div class="sec-h"><h3>Cost tracker</h3><span class="sub">what the researches cost in Apify credits (scrapers) and OpenRouter credits (AI), in USD · recorded per run</span></div>
    <div class="kpis">
      <div class="kpi"><span class="l">Total spent</span><span class="v">${fmtUsd(sp.total_usd)}</span><span class="s">${sp.tracked} research${sp.tracked===1?"":"es"} tracked${avg!=null?` · avg ${fmtUsd(avg)} each`:""}</span></div>
      <div class="kpi"><span class="l">${esc(monthName)}</span><span class="v">${fmtUsd(mUsd)}</span><span class="s">${mN} research${mN===1?"":"es"} this month</span></div>
      <div class="kpi flare"><span class="l">Today</span><span class="v">${fmtUsd(tUsd)}</span><span class="s">${tN} research${tN===1?"":"es"} today</span></div>
      <div class="kpi"><span class="l">Scrapers vs AI</span><span class="v" style="font-size:24px">${fmtUsd(sp.apify_usd)}<small>+ ${fmtUsd(sp.brain_usd)} AI</small></span><span class="s">Apify credits · OpenRouter credits${sp.brain_untracked?` (AI not recorded for ${sp.brain_untracked})`:""}</span></div>
    </div>
    <div class="costgrid">
      <div class="panel"><h3>Spend per day</h3><p class="hint">last 30 days · hover a bar for the day's total</p>${spendChart(days)}</div>
      <div class="panel"><h3>Spend by platform</h3><p class="hint">all time · which scrapers cost the most</p><div class="bars">${plats.map(([p,v]) => `<div class="bar" title="${esc(p==="ai"?"AI analysis":PLAT[p]?.name||p)}: ${fmtUsd(v)} (${Math.round(100*v/Math.max(sp.total_usd,0.000001))}%)"><span class="lbl">${p==="ai"?"🧠 AI analysis":`${logo(p,"xs")} ${esc(PLAT[p]?.name||p)}`}</span><span class="trk"><span class="fill" style="width:${(100*v/pmax).toFixed(1)}%${p==="ai"?";background:var(--flare)":""}"></span></span><span class="val">${fmtUsd(v)}</span></div>`).join("")||`<span class="hint">No platform costs yet</span>`}</div></div>
    </div>
    ${sp.untracked||sp.brain_untracked?`<p class="costnote">${sp.untracked?`${sp.untracked} report${sp.untracked===1?"":"s"} ha${sp.untracked===1?"s":"ve"} no cost data (still running, or their Apify runs are gone). `:""}${sp.brain_untracked?`For ${sp.brain_untracked} report${sp.brain_untracked===1?"":"s"} made before the tracker existed the AI charge was not recorded (marked * in the table), so their totals cover the scrapers only.`:""}</p>`:""}
  </section>`;
}
function spendChart(days) {
  const W = 640, H = 160, L = 44, R = 8, T = 10, B = 22, pw = W - L - R, ph = H - T - B;
  const max = Math.max(...days.map(d => d.usd), 0.01);
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
  const top = nice(max); const ticks = [0, top / 2, top];
  const bw = pw / days.length, gap = Math.max(2, bw * 0.25), w = bw - gap;
  const y = v => T + ph - (v / top) * ph;
  const bar = (d, i) => { const h = Math.max(0, ph * d.usd / top); const x = L + i * bw + gap / 2; const yy = T + ph - h; const r = Math.min(4, w / 2, h);

async function loadJob(id) {
  if (!job || job.id !== id) { $("#main").innerHTML = `<div class="empty" style="margin-top:40px"><b>Loading research…</b></div>`; job = null; }
  try { const r = await fetchJobLive(id, "/api/job?id="+id); job = r.job; renderJob(); schedulePoll(); }
  catch (e) {
    if (job?.id === id && job.status === "running" && e.status !== 404) { toast("Connection hiccup — retrying…", 2500); schedulePoll(); return; } // keep the veil + polling alive through a transient error
    renderVeil();
    $("#main").innerHTML = `<div class="note err" style="margin-top:30px">${esc(e.message)} <button class="btn ghost" onclick="location.href='/'">Back</button></div>`;
  }
}
function schedulePoll() { stopPolling(); if (job?.status === "running" || job?.brain?.status === "running") pollTimer = setTimeout(() => loadJob(job.id), 3500); }
function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }
// A poll that triggers the AI step stays open until the analysis finishes (up to ~4 min). While it is pending,
// read the stored job every 3 s (?peek=1, no side effects) so platform "done in" times and the analysis timer stay live.
let peekTimer = null;
function startPeek(id) {
  stopPeek();
  peekTimer = setInterval(async () => {
    try {
      const r = await api("/api/job?id="+id+"&peek=1");
      if (!r?.job || !job || job.id !== id) return;
      if ((r.job.updated_at || "") > (job.updated_at || "")) { job = r.job; renderJob(); }
    } catch {}
  }, 3000);
}
function stopPeek() { if (peekTimer) { clearInterval(peekTimer); peekTimer = null; } }
async function fetchJobLive(id, url) {
  const t = setTimeout(() => startPeek(id), 2500); // normal polls answer in well under a second; only a slow one needs peeking
  try { return await api(url); } finally { clearTimeout(t); stopPeek(); }
}

function briefText(p) { return [`TREND BRIEF — ${p.title}`, `Research: ${p.topic} · Category: ${p.category} · Brand safety: ${p.safety} · Score: ${p.score}/100`, `Platforms: ${(p.platforms||[]).map(x=>PLAT[x]?.name||x).join(", ")}`, p.why?`Why now: ${p.why}`:"", p.angles?.length?`Angles:\n${p.angles.map(a=>"  • "+a).join("\n")}`:"", p.formats?.length?`Formats: ${p.formats.join(", ")}`:"", p.url?`Source: ${p.url}`:"", p.note?`Notes: ${p.note}`:"", `Link: ${location.origin}/r/${p.job}`].filter(Boolean).join("\n"); }
function renderDrawer() {
  $("#drawer-body").innerHTML = pins.length ? pins.map(p => `<div class="card"><div class="meta">${(p.platforms||[]).map(x=>logo(x,"xs")).join("")}${tag(p.category,"cat")}${safetyTag(p.safety)}<span class="tag">score ${p.score}</span></div><h4><a class="ext" href="${esc(linkOf({ url:p.url, platform:p.platforms?.[0], topic:p.title }))}" target="_blank" rel="noopener">${esc(p.title)}</a></h4><div style="font-size:12px;color:var(--muted)">from “${esc(p.topic)}”</div>${p.why?`<div style="font-size:12.5px;color:var(--ink-2)">${esc(p.why)}</div>`:""}<textarea data-note="${esc(p.id)}" placeholder="Notes: client, owner, deadline…">${esc(p.note||"")}</textarea><div class="acts"><button class="btn" data-brief="${esc(p.id)}">Copy brief</button><button class="btn ghost" data-unpin="${esc(p.id)}">Remove</button></div></div>`).join("") : `<div class="empty"><b>Nothing shortlisted</b>Star any signal or result to keep it here. The shortlist is saved in this browser.</div>`;
}
$("#drawer-body").addEventListener("click", e => { const u=e.target.closest("[data-unpin]"); if(u){ pins=pins.filter(p=>p.id!==u.dataset.unpin); savePins(); renderDrawer(); document.querySelectorAll("[data-pin]").forEach(b=>b.setAttribute("aria-pressed",pins.some(p=>p.id===b.dataset.pin))); return; } const b=e.target.closest("[data-brief]"); if(b){ const p=pins.find(x=>x.id===b.dataset.brief); if(p) copyText(briefText(p)); } });
$("#drawer-body").addEventListener("input", e => { const n=e.target.closest("[data-note]"); if(!n) return; const p=pins.find(x=>x.id===n.dataset.note); if(p){ p.note=n.value; savePins(); } });
$("#shortlist-btn").addEventListener("click", () => { renderDrawer(); $("#drawer").classList.toggle("open"); });
$("#drawer-close").addEventListener("click", () => $("#drawer").classList.remove("open"));
$("#copy-all").addEventListener("click", () => copyText(pins.map(briefText).join("\n\n---\n\n")));
savePins();

/* ---------- settings modal ---------- */
$("#settings-btn").addEventListener("click", async () => {
  try { health = await api("/api/health"); } catch {}
  const box = document.createElement("div"); box.className = "modal"; box.innerHTML = `<div class="box" role="dialog" aria-label="Settings">
    <h3>Settings</h3>
    <div class="help">${health?.server_keys ? `This site has shared keys${health.access_code?" protected by an access code":""}. You can still use your own keys below; they stay in this browser only.` : "This site has no shared keys. Add your own Apify token (required) and OpenRouter key (for the AI analysis)."}</div>
    ${health?.access_code?`<label>Access code<input id="s-code" type="password" value="${esc(settings.code||"")}" placeholder="given by the site owner"></label>
    ${settings.code?`<div class="help" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Share the tool without handing out the code:</span><button class="btn" id="s-invite" type="button">Copy invite link</button></div>`:""}`:""}
    <fieldset><legend>Your own keys (optional)</legend>
      <label>Apify API token<input id="s-apify" type="password" value="${esc(settings.apify||"")}" placeholder="apify_api_…"><span class="help">console.apify.com → Settings → API &amp; Integrations. Research results are saved to your Apify account.</span></label>
      <label>OpenRouter API key<input id="s-or" type="password" value="${esc(settings.openrouter||"")}" placeholder="sk-or-v1-…"><span class="help">openrouter.ai → Keys. Needed for signals, angles and summaries.</span></label>
      <label>Model<input id="s-model" type="text" value="${esc(settings.model||"")}" placeholder="${esc(health?.model||"anthropic/claude-sonnet-4.5")}"><span class="help">Any OpenRouter model id. Leave empty for the default.</span></label>
    </fieldset>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="s-cancel">Cancel</button><button class="btn primary" id="s-save">Save</button></div></div>`;
  document.body.appendChild(box);
  box.querySelector("#s-cancel").addEventListener("click", () => box.remove());
  box.querySelector("#s-invite")?.addEventListener("click", () => copyText(inviteLink(), "Invite link copied — anyone who opens it can run research"));
  box.addEventListener("click", e => { if (e.target === box) box.remove(); });
  box.querySelector("#s-save").addEventListener("click", () => { settings = { code: box.querySelector("#s-code")?.value.trim()||"", apify: box.querySelector("#s-apify").value.trim(), openrouter: box.querySelector("#s-or").value.trim(), model: box.querySelector("#s-model").value.trim() }; saveSettings(); box.remove(); toast("Settings saved"); if (!job) renderHome(); });
});

/* ---------- utils ---------- */
function copyText(t, msg="Copied") { const done = () => toast(msg); try { navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t)); } catch { fallbackCopy(t); } }
function fallbackCopy(t) { const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Copied");}catch{toast("Select and copy manually");} ta.remove(); }
let toastEl; function toast(msg, ms=1800) { toastEl?.remove(); toastEl=document.createElement("div"); toastEl.className="toast"; toastEl.textContent=msg; document.body.appendChild(toastEl); setTimeout(()=>toastEl?.remove(),ms); }
function sinceText(iso) { const m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 60 ? `${m} min ago` : `${Math.round(m/60)} h ago`; }

route();
</script>
</body>
</html>
